# The site's live data job. Every 10 minutes on game nights it keeps these on the `highlights` branch, which the site
# reads straight from raw.githubusercontent.com:
#   highlights.json      the NBA's full game highlights on YouTube, by ESPN game id (posted about an hour after the final)
#   catv.json            each game's Canadian streaming service (refreshed every 3 hours)
#   social.json          the Social tab's last day of posts from r/nba and X
#   social-archive.json  the biggest posts of the week and season
#   videos.json          the Videos tab: interviews, breakdowns and podcasts from YouTube (scripts/video-channels.js)
# That branch is one commit, replaced on every run, so main's history stays clean.
name: Full game highlights

on:
  schedule:
    - cron: '*/10 0-8,16-23 * * *'  # every 10 minutes from noon to 4-5 AM Eastern, when games are on and end
    - cron: '7 9-13,15 * * *'       # hourly through the morning
    - cron: '37 14 * * *'           # the daily check: this run fails if a source couldn't be read
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: highlights
  cancel-in-progress: false

jobs:
  highlights:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Only a branch that isn't there yet (ls-remote's exit code 2) means a first run. A read that keeps failing stops
      # the job, so a network blip can't force-push lists rebuilt from scratch over the season's archive
      - name: Read the current lists
        id: prev
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          for try in 1 2 3; do
            rc=0
            git ls-remote --exit-code origin refs/heads/highlights > /dev/null || rc=$?
            if [ $rc -eq 0 ] && git fetch -q --depth=1 origin highlights; then
              for f in highlights.json catv.json social.json social-archive.json videos.json; do
                git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/prev/$f" 2>/dev/null || rm -f "$RUNNER_TEMP/prev/$f"
              done
              exit 0
            fi
            if [ $rc -eq 2 ]; then
              echo "No lists yet; this run builds them from the whole season."
              exit 0
            fi
            [ $try -eq 3 ] || sleep 15
          done
          echo "::error::The current lists couldn't be read, so nothing was rebuilt or published."
          exit 1

      - name: Find new full game highlights
        env:
          PREV: ${{ runner.temp }}/prev/highlights.json
          OUT: ${{ runner.temp }}/out/highlights.json
          CHECK: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '37 14 * * *' }}
        run: node scripts/highlights.js

      - name: Refresh where each game streams in Canada
        if: ${{ !cancelled() && steps.prev.outcome == 'success' }}
        env:
          PREV: ${{ runner.temp }}/prev/catv.json
          OUT: ${{ runner.temp }}/out/catv.json
          CHECK: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '37 14 * * *' }}
        run: node scripts/catv-job.js

      - name: Refresh the social feed
        if: ${{ !cancelled() && steps.prev.outcome == 'success' }}
        timeout-minutes: 9
        env:
          PREV: ${{ runner.temp }}/prev/social.json
          PREV_ARCH: ${{ runner.temp }}/prev/social-archive.json
          OUT: ${{ runner.temp }}/out/social.json
          OUT_ARCH: ${{ runner.temp }}/out/social-archive.json
          CHECK: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '37 14 * * *' }}
        run: node scripts/social-job.js

      - name: Refresh the videos
        if: ${{ !cancelled() && steps.prev.outcome == 'success' }}
        timeout-minutes: 6
        env:
          PREV: ${{ runner.temp }}/prev/videos.json
          OUT: ${{ runner.temp }}/out/videos.json
          CHECK: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '37 14 * * *' }}
        run: node scripts/videos.js

      # Runs even when a step above failed the daily check, so the other lists still go out, but never after a failed read
      - name: Publish
        if: ${{ !cancelled() && steps.prev.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if [ -z "$(ls -A "$RUNNER_TEMP/out")" ]; then
            echo "Nothing new to publish."
            exit 0
          fi
          # The branch is replaced whole, so a list that didn't change goes back in as it was
          for f in highlights.json catv.json social.json social-archive.json videos.json; do
            [ -f "$RUNNER_TEMP/out/$f" ] || [ ! -f "$RUNNER_TEMP/prev/$f" ] || cp "$RUNNER_TEMP/prev/$f" "$RUNNER_TEMP/out/$f"
          done
          cd "$RUNNER_TEMP/out"
          git init -q -b highlights
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Live data: highlights, Canadian TV and the social feed"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" highlights
          echo "Published."
