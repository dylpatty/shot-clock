<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA</title>
<meta name="description" content="A personal NBA dashboard: live scores, schedule, standings, stats, odds, injuries, team pages and an ask-anything search bar, from ESPN's public feeds.">
<!-- Icons and home screen app settings -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="NBA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E2E5EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07090C" media="(prefers-color-scheme: dark)">
<!-- Bump this and every ?v= below in any commit that changes js/ or css/ -->
<meta name="build" content="20261031b">
<!-- ESPN's feeds (fetch() makes CORS requests, hence crossorigin) and its image host (no-cors) -->
<link rel="preconnect" href="https://site.api.espn.com" crossorigin>
<link rel="preconnect" href="https://site.web.api.espn.com" crossorigin>
<link rel="preconnect" href="https://sports.core.api.espn.com" crossorigin>
<link rel="preconnect" href="https://a.espncdn.com">
<!-- The full game highlights list (fetched, so CORS) and YouTube's video stills -->
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="css/app.css?v=20261031b">
<script>
  /* Apply the saved theme before first paint so the page doesn't flash */
  try {
    var s = JSON.parse(localStorage.getItem('nba.settings.v2') || 'null');
    if (s && s.theme && s.theme !== 'system') document.documentElement.setAttribute('data-theme', s.theme);
    // The browser toolbar matches a chosen theme, not just the phone's setting
    if (s && (s.theme === 'dark' || s.theme === 'light')) document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.removeAttribute('media'); m.setAttribute('content', s.theme === 'dark' ? '#07090C' : '#E2E5EA'); });
    if (s && s.density) document.documentElement.setAttribute('data-density', s.density);
    var look = s && s.teamTheme ? JSON.parse(localStorage.getItem('nba.look') || 'null') : null;
    if (look) for (var k in look) document.documentElement.style.setProperty(k, look[k]);
  } catch (e) {}
</script>
</head>
<body>
<header class="top" id="top">
  <div class="page top-row">
    <a class="brand" href="#home" aria-label="NBA, go to home">NBA</a>
    <form class="ask" id="ask-form" role="search" autocomplete="off">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m13 13 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <label class="sr" for="ask-input">Ask anything about the NBA</label>
      <input id="ask-input" type="search" placeholder="Ask anything: Warriors next 10 games, who leads the MVP race…" enterkeyhint="search">
      <kbd>/</kbd>
      <button class="ask-go" type="submit">Ask</button>
    </form>
    <div class="top-meta">
      <span class="hdr-team" id="teampick"></span>
      <span class="livepill" id="livepill"></span>
      <span class="upd" id="upd" aria-live="polite"></span>
      <button class="ib" data-act="settings" aria-label="Settings">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 6h8M15 6h2M3 14h2M9 14h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/><circle cx="13" cy="6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7" cy="14" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
    </div>
  </div>
  <nav class="page tabbar" id="tabbar" role="tablist" aria-label="Sections"></nav>
</header>

<section class="ask-panel" id="ask-panel" hidden aria-label="Answers" aria-live="polite"></section>

<div class="page band-host" id="pband"></div>
<main class="page view" id="view"></main>
<section class="page season-host" id="season" aria-label="Rest of the season"></section>
<footer class="page foot">Data from ESPN's public feeds, with odds from DraftKings via ESPN. These feeds are unofficial and can change without notice. Not affiliated with the NBA or ESPN. Settings are saved in this browser.</footer>

<div class="scrim" id="scrim" hidden data-act="close"></div>
<aside class="drawer modal" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="dr-title"></aside>
<aside class="drawer narrow" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="st-title"></aside>
<!-- Highlight videos play here, outside the view and the game window, so live repaints can't cut one off -->
<dialog class="vid" id="vid" aria-label="Highlights"></dialog>

<script src="js/core.js?v=20261031b"></script>
<script src="js/ui.js?v=20261031b"></script>
<script src="js/views.js?v=20261031b"></script>
<script src="js/games.js?v=20261031b"></script>
<script src="js/home.js?v=20261031b"></script>
<script src="js/players.js?v=20261031b"></script>
<script src="js/ask.js?v=20261031b"></script>
<script>NBA.boot();</script>
</body>
</html>
